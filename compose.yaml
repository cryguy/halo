name: halo

services:
  halo-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env.selfhost
    environment:
      AUTH_MODE: local
      DATA_DIR: /data
      PORT: "8787"
    expose:
      - "8787"
    volumes:
      - halo_data:/data
    networks:
      - terra_edge
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8787/health')
          .then(async response => {
            if (!response.ok || !(await response.json()).ok) process.exit(1)
          })
          .catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

volumes:
  halo_data:
    name: halo_data

networks:
  terra_edge:
    name: terra_edge
    external: true
